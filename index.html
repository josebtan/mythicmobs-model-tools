<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MythicMobs Model Preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #1e1e24; overflow: hidden; font-family: sans-serif; }
  #info {
    position: absolute; top: 12px; left: 12px; color: #eee; z-index: 10;
    background: rgba(0,0,0,0.45); padding: 8px 14px; border-radius: 8px; font-size: 14px;
  }
  #info b { color: #fff; }
  #model-select {
    position: absolute; top: 12px; right: 12px; z-index: 10;
  }
  canvas { display: block; }
</style>
</head>
<body>
<div id="info">
  <b>MythicMobs Model Preview</b><br>
  Click y arrastrá para rotar &middot; scroll para zoom
</div>
<div id="model-select">
  <select id="modelPicker">
    <option value="demo_mob_cubes.json" data-bbmodel="demo_mob.bbmodel">demo_mob</option>
    <option value="golem_boss_cubes.json" data-bbmodel="golem_boss.bbmodel" selected>golem_boss</option>
  </select>
  <a id="downloadBtn" href="golem_boss.bbmodel" download style="
      display:inline-block; margin-left:8px; padding:6px 12px; background:#2ea043;
      color:#fff; text-decoration:none; border-radius:6px; font-size:14px;">
    Descargar .bbmodel
  </a>
</div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1e1e24);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(45, 35, 45);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 12, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.update();

// Lighting
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(20, 30, 10);
scene.add(dirLight);
const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.3);
dirLight2.position.set(-20, 10, -10);
scene.add(dirLight2);

// Ground grid (Minecraft-style, 1 unit = 1/16 block)
const grid = new THREE.GridHelper(32, 16, 0x555566, 0x333340);
scene.add(grid);

const axes = new THREE.AxesHelper(4);
scene.add(axes);

// New JSON format: { texture: "x.png", texture_size: [W,H], cubes: [{name, from, to, origin, uv_faces}] }
// uv_faces per cube: { east/west/north/south/up/down: [x1,y1,x2,y2] } in texture pixel coords.
let currentGroup = null;

function clearModel() {
  if (currentGroup) {
    scene.remove(currentGroup);
    currentGroup.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material && o.material.map) o.material.map.dispose();
      if (o.material) o.material.dispose();
    });
  }
}

const textureLoader = new THREE.TextureLoader();

// BoxGeometry (r128) group order is [px, nx, py, ny, pz, nz].
// Our own face-naming convention: east=+x, west=-x, up=+y, down=-y, south=+z (front), north=-z (back).
const FACE_ORDER = ['east', 'west', 'up', 'down', 'south', 'north'];

function applyBoxUV(geometry, uvFaces, texW, texH) {
  const uvAttr = geometry.attributes.uv;
  for (let f = 0; f < 6; f++) {
    const rect = uvFaces[FACE_ORDER[f]];
    if (!rect) continue;
    const [x1, y1, x2, y2] = rect;
    const u1 = x1 / texW, u2 = x2 / texW;
    // Flip V: image Y grows downward, UV V grows upward.
    const v1 = 1 - y2 / texH, v2 = 1 - y1 / texH;
    const base = f * 4;
    uvAttr.setXY(base + 0, u1, v1);
    uvAttr.setXY(base + 1, u2, v1);
    uvAttr.setXY(base + 2, u1, v2);
    uvAttr.setXY(base + 3, u2, v2);
  }
  uvAttr.needsUpdate = true;
}

function buildModel(data) {
  clearModel();
  const group = new THREE.Group();

  const isTextured = data && !Array.isArray(data) && data.cubes;
  const cubes = isTextured ? data.cubes : data;
  const [texW, texH] = isTextured ? data.texture_size : [0, 0];

  let material;
  if (isTextured && data.texture) {
    const tex = textureLoader.load(data.texture + '?v=' + Date.now());
    tex.magFilter = THREE.NearestFilter;
    tex.minFilter = THREE.NearestFilter;
    tex.generateMipmaps = false;
    material = new THREE.MeshLambertMaterial({ map: tex });
  } else {
    material = new THREE.MeshLambertMaterial({ color: 0x8a7a68 });
  }

  cubes.forEach((c) => {
    const [x0, y0, z0] = c.from;
    const [x1, y1, z1] = c.to;
    const sx = Math.abs(x1 - x0), sy = Math.abs(y1 - y0), sz = Math.abs(z1 - z0);

    const geom = new THREE.BoxGeometry(sx, sy, sz);
    if (isTextured && c.uv_faces) applyBoxUV(geom, c.uv_faces, texW, texH);

    const mesh = new THREE.Mesh(geom, material);

    if (c.world_center && c.world_R) {
      // world_R is a 3x3 rotation matrix (row-major) baked by build_bbmodel.py from the
      // part hierarchy's `rotation` fields (e.g. the golem's forward hunch), composed
      // down from parent bones -- same mechanism an animation would use, just static here.
      const R = c.world_R;
      const m4 = new THREE.Matrix4().set(
        R[0][0], R[0][1], R[0][2], 0,
        R[1][0], R[1][1], R[1][2], 0,
        R[2][0], R[2][1], R[2][2], 0,
        0, 0, 0, 1
      );
      mesh.quaternion.setFromRotationMatrix(m4);
      mesh.position.set(c.world_center[0], c.world_center[1], c.world_center[2]);
    } else {
      const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, cz = (z0 + z1) / 2;
      mesh.position.set(cx, cy, cz);
    }

    mesh.name = c.name || 'cube';

    const edges = new THREE.EdgesGeometry(geom);
    const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000, opacity: 0.25, transparent: true }));
    mesh.add(line);

    group.add(mesh);
  });

  scene.add(group);
  currentGroup = group;
}

function loadModel(path) {
  // Cache-bust: avoid the browser serving a stale cached copy of the JSON
  // after we push updates to the model data.
  const url = path + (path.includes('?') ? '&' : '?') + 'v=' + Date.now();
  fetch(url)
    .then(r => r.json())
    .then(buildModel)
    .catch(err => {
      document.getElementById('info').innerHTML += `<br><span style="color:#ff8080">Error cargando ${path}: ${err}</span>`;
    });
}

const picker = document.getElementById('modelPicker');
const downloadBtn = document.getElementById('downloadBtn');

function syncDownloadLink() {
  const opt = picker.options[picker.selectedIndex];
  downloadBtn.href = opt.dataset.bbmodel;
  downloadBtn.setAttribute('download', opt.dataset.bbmodel);
}

picker.addEventListener('change', (e) => {
  loadModel(e.target.value);
  syncDownloadLink();
});

syncDownloadLink();
loadModel(picker.value);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
